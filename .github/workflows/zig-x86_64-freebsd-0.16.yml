name: zig-x86_64-freebsd-0.16

# x86_64-freebsd test leg, pinned to zig 0.16. Runs when a pull request is merged
# (any target branch), or on a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-freebsd
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # tests the ref that triggered the run: the dispatched branch, or the
      # merged pull request result
      - name: Checkout
        uses: actions/checkout@v7

      # No GitHub-hosted FreeBSD runner exists, so the job boots a real
      # FreeBSD VM on top of this ubuntu host and runs the suite inside it.
      # No docker daemon in that VM, so postgrez and rediz test-integration
      # (container lifecycle) are skipped here.
      # A leg that goes silent for many minutes can be a stuck VM rather than
      # a hung test: re-run the job once before diagnosing.
      - name: Test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            # fetch is the stock FreeBSD download tool, the base image has no curl
            fetch -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-freebsd-0.16.0.tar.xz
            tar -C /usr/local -xf /tmp/zig.tar.xz
          run: |
            export PATH="/usr/local/zig-x86_64-freebsd-0.16.0:$PATH"
            cd $GITHUB_WORKSPACE
            zig version

            # The whole leg is one ssh script, so a failed suite must not stop
            # the rest: every suite runs and failures accumulate. The failed:
            # line at the end is the authoritative verdict for this leg.
            failures=""

            zig build unit-test --summary all || failures="$failures unit-test"
            zig build integration-test --summary all || failures="$failures integration-test"
            zig build behaviour-test --summary all || failures="$failures behaviour-test"
            zig build edge-test --summary all || failures="$failures edge-test"

            # examples is compile-plus-install only. test-runner-all drives every zix
            # protocol end to end over real sockets inside this VM.
            zig build examples --summary all || failures="$failures examples"
            zig build test-runner-all --summary all || failures="$failures test-runner-all"
            zig build postgrez-test-unit --summary all || failures="$failures postgrez-test-unit"
            zig build rediz-test-unit --summary all || failures="$failures rediz-test-unit"
            zig build prometheuz-test-unit --summary all || failures="$failures prometheuz-test-unit"
            zig build postgrez-test-behaviour --summary all || failures="$failures postgrez-test-behaviour"
            zig build postgrez-test-edge --summary all || failures="$failures postgrez-test-edge"
            zig build rediz-test-behaviour --summary all || failures="$failures rediz-test-behaviour"
            zig build rediz-test-edge --summary all || failures="$failures rediz-test-edge"
            zig build prometheuz-test-behaviour --summary all || failures="$failures prometheuz-test-behaviour"
            zig build prometheuz-test-edge --summary all || failures="$failures prometheuz-test-edge"

            if [ -n "$failures" ]; then
              echo "failed:$failures"
              exit 1
            fi
