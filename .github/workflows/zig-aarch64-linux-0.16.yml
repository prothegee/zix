name: zig-aarch64-linux-0.16

# aarch64-linux test leg, pinned to zig 0.16. Runs when a pull request is merged
# (any target branch), or on a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: aarch64-linux
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04-arm
    steps:
      # tests the ref that triggered the run: the dispatched branch, or the
      # merged pull request result
      - name: Checkout
        uses: actions/checkout@v7

      # toolchain comes from the official tarball: the runner image does not
      # ship the pinned 0.16.0
      - name: Install zig 0.16.0
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz

          echo "$PWD/zig-aarch64-linux-0.16.0" >> "$GITHUB_PATH"

      # sanity print so the log records the exact toolchain in use
      - name: zig version
        run: zig version

      # zix suites run one step each so a red step names the failing suite.
      # if: always() keeps the later suites running after an earlier failure,
      # so one run reports every failing suite at once.
      - name: zix unit tests
        run: zig build unit-test --summary failures

      - name: zix integration tests
        if: always()
        run: zig build integration-test --summary failures

      - name: zix behaviour tests
        if: always()
        run: zig build behaviour-test --summary failures

      - name: zix edge tests
        if: always()
        run: zig build edge-test --summary failures

      # driver unit steps carry no if: always(), so they are skipped when a
      # zix suite above failed: fix the engine first, the drivers rerun after.
      - name: postgrez unit tests
        run: zig build postgrez-test-unit --summary failures

      - name: rediz unit tests
        run: zig build rediz-test-unit --summary failures

      - name: prometheuz unit tests
        run: zig build prometheuz-test-unit --summary failures

      # docker ships preinstalled on this arm64 ubuntu runner, so postgrez and
      # rediz can own their own container lifecycle here. test-runner is out
      # of scope.
      - name: postgrez integration tests
        run: zig build postgrez-test-integration --summary failures

      - name: rediz integration tests
        run: zig build rediz-test-integration --summary failures
