name: x86_64-openbsd

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-openbsd
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      # No GitHub-hosted OpenBSD runner exists, so the job boots a real
      # OpenBSD VM on top of this ubuntu host and runs the suite inside it.
      # No docker daemon in that VM, so postgrez and rediz test-integration
      # (container lifecycle) are skipped here.
      - name: Test in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          prepare: |
            ftp -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-openbsd-0.16.0.tar.xz
            xz -dc /tmp/zig.tar.xz | tar -C /usr/local -xf -
          run: |
            export PATH="/usr/local/zig-x86_64-openbsd-0.16.0:$PATH"
            cd $GITHUB_WORKSPACE
            zig version

            failures=""

            zig build unit-test || failures="$failures unit-test"
            zig build integration-test || failures="$failures integration-test"
            zig build behaviour-test || failures="$failures behaviour-test"
            zig build edge-test || failures="$failures edge-test"
            zig build postgrez-test-unit || failures="$failures postgrez-test-unit"
            zig build rediz-test-unit || failures="$failures rediz-test-unit"
            zig build prometheuz-test-unit || failures="$failures prometheuz-test-unit"

            if [ -n "$failures" ]; then
              echo "failed:$failures"
              exit 1
            fi
