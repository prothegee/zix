name: x86_64-netbsd

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-netbsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No GitHub-hosted NetBSD runner exists, so the job boots a real
      # NetBSD VM on top of this ubuntu host and runs the suite inside it.
      # No docker daemon in that VM, so postgrez and rediz test-integration
      # (container lifecycle) are skipped here.
      - name: Test in NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          prepare: |
            mkdir -p /usr/local/bin
            ftp -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-netbsd-0.16.0.tar.xz
            tar -C /usr/local -xf /tmp/zig.tar.xz

            ln -sf /usr/local/zig-x86_64-netbsd-0.16.0/zig /usr/local/bin/zig
          run: |
            cd $GITHUB_WORKSPACE
            zig version

            zig build test-all
            zig build postgrez-test-unit
            zig build rediz-test-unit
            zig build prometheuz-test-unit
