name: zig-x86_64-openbsd-0.16

# x86_64-openbsd test leg, pinned to zig 0.16. Runs when a pull request is merged
# (any target branch), or on a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-openbsd
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # backstop for the whole leg. GitHub's own default is 6 hours, long enough for a
    # hung test to burn a day of runner minutes before anyone notices.
    timeout-minutes: 60
    steps:
      # tests the ref that triggered the run: the dispatched branch, or the
      # merged pull request result
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v7

      # No GitHub-hosted OpenBSD runner exists, so the job boots a real
      # OpenBSD VM on top of this ubuntu host and runs the suite inside it.
      # No docker daemon in that VM, so postgrez and rediz test-integration
      # (container lifecycle) are skipped here.
      # A leg that goes silent for many minutes can be a stuck VM rather than
      # a hung test: re-run the job once before diagnosing.
      # The whole leg is one step, so a step-level cap is the only per-leg bound there is.
      # It sits under the job cap on purpose: killing the step still runs Post Checkout, so
      # the log is uploaded. A job-level kill loses the step body entirely.
      - name: Test in OpenBSD
        timeout-minutes: 50
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          prepare: |
            # ftp is the stock OpenBSD download tool, the base image has no curl
            ftp -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-openbsd-0.16.0.tar.xz
            # OpenBSD tar cannot read xz directly, decompress through xz -dc
            xz -dc /tmp/zig.tar.xz | tar -C /usr/local -xf -
          run: |
            export PATH="/usr/local/zig-x86_64-openbsd-0.16.0:$PATH"
            cd $GITHUB_WORKSPACE
            zig version

            # The whole leg is one ssh script, so a failed suite must not stop
            # the rest: every suite runs and failures accumulate. The failed:
            # line at the end is the authoritative verdict for this leg.
            failures=""

            zig build unit-test --summary all --test-timeout 15s || failures="$failures unit-test"
            zig build integration-test --summary all --test-timeout 15s || failures="$failures integration-test"
            zig build behaviour-test --summary all --test-timeout 15s || failures="$failures behaviour-test"
            zig build edge-test --summary all --test-timeout 15s || failures="$failures edge-test"

            # examples is compile-plus-install only. test-runner-all drives every zix
            # protocol end to end over real sockets inside this VM.
            # Both are slower than a test suite and neither has a --test-timeout to bound it,
            # so they carry the same 6 minute cap the native legs give them as steps. timeout
            # exits 124, which the || below records like any other failure, so one stall costs
            # its own command rather than the rest of the leg.
            timeout 6m zig build examples --summary all || failures="$failures examples"
            timeout 6m zig build test-runner-all --summary all || failures="$failures test-runner-all"
            zig build postgrez-test-unit --summary all || failures="$failures postgrez-test-unit"
            zig build rediz-test-unit --summary all || failures="$failures rediz-test-unit"
            zig build prometheuz-test-unit --summary all || failures="$failures prometheuz-test-unit"
            zig build postgrez-test-behaviour --summary all || failures="$failures postgrez-test-behaviour"
            zig build postgrez-test-edge --summary all || failures="$failures postgrez-test-edge"
            zig build rediz-test-behaviour --summary all || failures="$failures rediz-test-behaviour"
            zig build rediz-test-edge --summary all || failures="$failures rediz-test-edge"
            zig build prometheuz-test-behaviour --summary all || failures="$failures prometheuz-test-behaviour"
            zig build prometheuz-test-edge --summary all || failures="$failures prometheuz-test-edge"

            if [ -n "$failures" ]; then
              echo "failed:$failures"
              exit 1
            fi
