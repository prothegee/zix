name: zig-x86_64-openbsd-0.16

# x86_64-openbsd test leg, pinned to zig 0.16. Runs when a pull request is merged
# (any target branch), or on a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-openbsd
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # backstop for the whole leg. GitHub's own default is 6 hours, long enough for a
    # hung test to burn a day of runner minutes before anyone notices. A healthy leg
    # lands inside this: five green runs measured 21m46s to 24m11s, and the step below
    # leaves room for two parked suites on top of that, so anything past 36 is a hang.
    timeout-minutes: 36
    steps:
      # tests the ref that triggered the run: the dispatched branch, or the
      # merged pull request result
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v7

      # No GitHub-hosted OpenBSD runner exists, so the job boots a real
      # OpenBSD VM on top of this ubuntu host and runs the suite inside it.
      # No docker daemon in that VM, so postgrez and rediz test-integration
      # (container lifecycle) are skipped here.
      # The == lines in the run script say which suite is in flight, so a leg that
      # goes quiet names what it is quiet on.
      # The whole leg is one step, so a step-level cap is the only per-leg bound there is.
      # It sits under the job cap on purpose: killing the step still runs Post Checkout, so
      # the log is uploaded. A job-level kill loses the step body entirely.
      # 30 over a 22 minute leg: one parked suite plus its retry costs 4 minutes, and the
      # cap has to clear that or a park is reported as a kill with no verdict line.
      - name: Test in OpenBSD
        timeout-minutes: 30
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          # nothing built inside the VM is wanted back on the host: this leg only reports pass or
          # fail. Left on, the action rsyncs the whole workspace back, which by then holds a
          # multi-gigabyte .zig-cache, and a copy that size across the VM link is its own failure
          # mode: one FreeBSD run had every suite pass and then reddened on rsync exit 255 at 2.4 GB.
          copyback: false
          prepare: |
            # ftp is the stock OpenBSD download tool, the base image has no curl
            ftp -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-openbsd-0.16.0.tar.xz
            # OpenBSD tar cannot read xz directly, decompress through xz -dc
            xz -dc /tmp/zig.tar.xz | tar -C /usr/local -xf -
          run: |
            export PATH="/usr/local/zig-x86_64-openbsd-0.16.0:$PATH"
            cd $GITHUB_WORKSPACE
            zig version

            # This VM shares its host: a stall can freeze one process for tens of seconds
            # while its neighbors finish in milliseconds, and the fixed bounds tuned for
            # native speed then kill healthy work. Two bounds are widened here: the runner's
            # per-check kill (this env) to 60s, and the per-test bound to 120s. 120s is far
            # past anything that ever ran honestly on this VM, and a test parked past it has
            # never recovered, so the 240s it used to carry only made a park cost twice as
            # much of the step budget. jzon and the drivers run nested, so --test-timeout
            # never reaches them and -Ddriver-test-timeout is what carries their bound.
            export ZIX_CHECK_TIMEOUT_MS=60000
            per_test=120s

            # The whole leg is one ssh script, so a failed suite must not stop
            # the rest: every suite runs and failures accumulate. The failed:
            # line at the end is the authoritative verdict for this leg.
            failures=""

            # Run one suite under its own bound and record it if it fails.
            #
            # Every suite is wrapped: this leg is one step, so without a per-suite bound a
            # single stall owns the whole leg until the step cap fires. One run sat 27
            # minutes on rediz-test-edge and reported nothing.
            #
            # A timed-out suite is retried once. A park here is a property of the VM, not of
            # any one test: five failures in one day parked five different tests across four
            # suites, never the same test twice, and none of them reproduce off this VM. A
            # real hang parks both times and is still reported. Only a timeout earns the
            # retry, so a genuine failure costs its one run and nothing more.
            #
            # The == line is this leg's progress. A passing suite prints nothing of its own
            # under --summary failures, which used to leave 16 unbroken minutes of silence
            # that read as a stuck VM, and it is also what names the suite the step cap died
            # on, since a killed step never reaches the verdict line.
            #
            # Every path returns 0 and a failure is only ever recorded in failures, so the
            # leg reaches its verdict whether or not the action wraps this script in set -e.
            run_suite() {
              name=$1
              cap=$2
              shift 2

              echo "== $name"

              # the status is written from inside the pipeline because a pipeline reports its
              # last command, which is tee. set +e keeps a failing suite from killing that
              # subshell before it writes, and the 1 seeded first is what the leg reads if the
              # subshell dies anyway: a suite whose outcome went missing counts as failed.
              echo 1 > /tmp/suite_status
              ( set +e; timeout "$cap" zig build "$name" "$@" --summary failures 2>&1; echo $? > /tmp/suite_status ) | tee /tmp/suite_out
              status=$(cat /tmp/suite_status)

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              # 124 is the wrapper killing the suite, the grep catches a test the build runner bounded
              if [ "$status" -ne 124 ] && ! grep -q 'timed out after' /tmp/suite_out; then
                failures="$failures $name"

                return 0
              fi

              echo "== $name retry after timeout"
              if timeout "$cap" zig build "$name" "$@" --summary failures; then
                return 0
              fi

              failures="$failures $name"

              return 0
            }

            run_suite unit-test 6m --test-timeout $per_test
            run_suite integration-test 6m --test-timeout $per_test
            run_suite behaviour-test 6m --test-timeout $per_test
            run_suite edge-test 6m --test-timeout $per_test
            run_suite jzon-test-all 6m -Ddriver-test-timeout=$per_test
            run_suite jzon-examples 6m

            # examples is compile-plus-install only. test-runner-all drives every zix protocol
            # end to end over real sockets inside this VM, so both get more than the 5 minutes a
            # driver suite gets from the native legs. examples gets 8: it is the step that builds
            # every example binary, and one run had it blow a 6 minute cap while every runtime
            # suite in the same run passed, which is the VM losing wall clock and nothing else.
            run_suite examples 8m
            run_suite zixer 6m
            run_suite zixer-unit-test 6m
            run_suite zixer-examples 6m
            run_suite zixer-test-runner-all 10m
            run_suite test-runner-all 9m
            run_suite postgrez-test-unit 6m -Ddriver-test-timeout=$per_test
            run_suite rediz-test-unit 6m -Ddriver-test-timeout=$per_test
            run_suite prometheuz-test-unit 6m -Ddriver-test-timeout=$per_test
            run_suite postgrez-test-behaviour 6m -Ddriver-test-timeout=$per_test
            run_suite postgrez-test-edge 6m -Ddriver-test-timeout=$per_test
            run_suite rediz-test-behaviour 6m -Ddriver-test-timeout=$per_test
            run_suite rediz-test-edge 6m -Ddriver-test-timeout=$per_test
            run_suite prometheuz-test-behaviour 6m -Ddriver-test-timeout=$per_test
            run_suite prometheuz-test-edge 6m -Ddriver-test-timeout=$per_test

            if [ -n "$failures" ]; then
              echo "failed:$failures"
              exit 1
            fi
