name: x86_64-windows

# x86_64-windows test leg. Runs when a pull request into main is merged, or on
# a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-windows
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      # always tests main, whatever ref triggered the run
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      # toolchain comes from the official zip: the runner image does not ship
      # the pinned 0.16.0
      - name: Install zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath .

          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\zig-x86_64-windows-0.16.0"

      # sanity print so the log records the exact toolchain in use
      - name: zig version
        shell: pwsh
        run: zig version

      # zix suites run one step each so a red step names the failing suite.
      # if: always() keeps the later suites running after an earlier failure,
      # so one run reports every failing suite at once.
      - name: zix unit tests
        shell: pwsh
        run: zig build unit-test

      - name: zix integration tests
        if: always()
        shell: pwsh
        run: zig build integration-test

      - name: zix behaviour tests
        if: always()
        shell: pwsh
        run: zig build behaviour-test

      - name: zix edge tests
        if: always()
        shell: pwsh
        run: zig build edge-test

      # driver unit steps carry no if: always(), so they are skipped when a
      # zix suite above failed: fix the engine first, the drivers rerun after.
      - name: postgrez unit tests
        shell: pwsh
        run: zig build postgrez-test-unit

      - name: rediz unit tests
        shell: pwsh
        run: zig build rediz-test-unit

      - name: prometheuz unit tests
        shell: pwsh
        run: zig build prometheuz-test-unit

      # no Linux container support on this runner, so postgrez and rediz
      # test-integration (container lifecycle) are skipped here.
