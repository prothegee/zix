name: zig-x86_64-windows-0.16

# x86_64-windows test leg, pinned to zig 0.16. Runs when a pull request is merged
# (any target branch), or on a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-windows
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    # backstop for the whole leg. GitHub's own default is 6 hours, long enough for a
    # hung test to burn a day of runner minutes before anyone notices. A healthy leg
    # lands well inside this: the slowest measured so far is the openbsd VM at 16
    # minutes, so anything past 30 is a hang, not a slow run.
    timeout-minutes: 40
    steps:
      # tests the ref that triggered the run: the dispatched branch, or the
      # merged pull request result
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v7

      # toolchain comes from the official zip: the runner image does not ship
      # the pinned 0.16.0
      - name: Install zig 0.16.0
        shell: pwsh
        timeout-minutes: 10
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath .

          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\zig-x86_64-windows-0.16.0"

      # sanity print so the log records the exact toolchain in use
      - name: zig version
        shell: pwsh
        timeout-minutes: 2
        run: zig version

      # zix suites run one step each so a red step names the failing suite.
      # if: always() keeps the later suites running after an earlier failure,
      # so one run reports every failing suite at once. timeout-minutes turns
      # a hung suite (a test blocked in socket io never completes on its own)
      # into a red step with logs instead of a job spinning for hours.
      # --test-timeout makes zig itself kill a test hung mid-body: without it
      # zig waits forever on an active test and buffers the child's stderr,
      # so the workflow kill loses every log line. With it, zig prints the
      # hung test's name plus its captured stderr and continues to the next
      # test, so one run enumerates every hang. 240s is ~5x the slowest
      # legitimate test on this runner (connect-retry ceiling ~3s).
      - name: zix unit tests
        timeout-minutes: 7
        shell: pwsh
        run: zig build unit-test --summary failures --test-timeout 420s

      - name: zix integration tests
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build integration-test --summary failures --test-timeout 360s

      - name: zix behaviour tests
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build behaviour-test --summary failures --test-timeout 360s

      - name: zix edge tests
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build edge-test --summary failures --test-timeout 360s

      # jzon is a standalone package under src/jzon with its own build.zig, so
      # these steps delegate into it. Its in-file tests belong to it too, which
      # is why jzon-test-all covers three tiers and the unit-test step above
      # does not reach them.
      - name: jzon tests
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build jzon-test-all -Ddriver-test-timeout=360s --summary failures

      # jzon examples used to ride `zig build examples`. They live in the jzon
      # package now, so they get a step of their own to keep the coverage.
      - name: jzon examples
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build jzon-examples --summary failures

      # examples is compile-plus-install only (no execution). test-runner-all then drives
      # every zix protocol end to end over real sockets, so unlike the cross-build matrix
      # (which only COMPILES runners for a foreign target) this leg actually executes them.
      # examples links ~95 binaries and the runner spawns a server child process per
      # protocol, so both are slower than a test suite: on the slower runners they landed
      # within seconds of the old 3 minute cap. Both carry 6. Past that it is a stall.
      - name: zix examples
        if: always()
        timeout-minutes: 12
        shell: pwsh
        run: zig build examples --summary failures

      # zixer keeps its own build files and steps: the gateway binary, its unit
      # tests, the proxy demo upstreams, and the runner that drives every demo
      # end to end through a real daemon. None of them ride on a zix step.
      - name: zixer gateway
        if: always()
        timeout-minutes: 9
        shell: pwsh
        run: zig build zixer --summary failures

      - name: zixer unit tests
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build zixer-unit-test --summary failures

      - name: zixer demo upstreams
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build zixer-examples --summary failures

      - name: zixer proxy runner
        if: always()
        timeout-minutes: 12
        shell: pwsh
        run: zig build zixer-test-runner-all --summary failures


      - name: zix protocol runners
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: zig build test-runner-all --summary failures

      # driver unit steps carry no if: always(), so they are skipped when a
      # zix suite above failed: fix the engine first, the drivers rerun after.
      - name: postgrez unit tests
        timeout-minutes: 4
        shell: pwsh
        run: zig build postgrez-test-unit --summary failures

      - name: rediz unit tests
        timeout-minutes: 4
        shell: pwsh
        run: zig build rediz-test-unit --summary failures

      - name: prometheuz unit tests
        timeout-minutes: 4
        shell: pwsh
        run: zig build prometheuz-test-unit --summary failures

      # driver behaviour and edge suites drive an in-process server, so they need
      # no container and run here even though test-integration cannot.
      - name: postgrez behaviour tests
        timeout-minutes: 5
        shell: pwsh
        run: zig build postgrez-test-behaviour --summary failures

      - name: postgrez edge tests
        timeout-minutes: 5
        shell: pwsh
        run: zig build postgrez-test-edge --summary failures

      - name: rediz behaviour tests
        timeout-minutes: 5
        shell: pwsh
        run: zig build rediz-test-behaviour --summary failures

      - name: rediz edge tests
        timeout-minutes: 5
        shell: pwsh
        run: zig build rediz-test-edge --summary failures

      - name: prometheuz behaviour tests
        timeout-minutes: 5
        shell: pwsh
        run: zig build prometheuz-test-behaviour --summary failures

      - name: prometheuz edge tests
        timeout-minutes: 5
        shell: pwsh
        run: zig build prometheuz-test-edge --summary failures

      # no Linux container support on this runner, so postgrez and rediz
      # test-integration (container lifecycle) are skipped here.
