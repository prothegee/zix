name: zig-x86_64-windows-0.16

# x86_64-windows test leg, pinned to zig 0.16. Runs when a pull request is merged
# (any target branch), or on a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-windows
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      # tests the ref that triggered the run: the dispatched branch, or the
      # merged pull request result
      - name: Checkout
        uses: actions/checkout@v7

      # toolchain comes from the official zip: the runner image does not ship
      # the pinned 0.16.0
      - name: Install zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath .

          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\zig-x86_64-windows-0.16.0"

      # sanity print so the log records the exact toolchain in use
      - name: zig version
        shell: pwsh
        run: zig version

      # zix suites run one step each so a red step names the failing suite.
      # if: always() keeps the later suites running after an earlier failure,
      # so one run reports every failing suite at once. timeout-minutes turns
      # a hung suite (a test blocked in socket io never completes on its own)
      # into a red step with logs instead of a job spinning for hours.
      - name: zix unit tests
        timeout-minutes: 3
        shell: pwsh
        run: zig build unit-test --summary all

      - name: zix integration tests
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: zig build integration-test --summary all

      - name: zix behaviour tests
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: zig build behaviour-test --summary all

      - name: zix edge tests
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: zig build edge-test --summary all

      # driver unit steps carry no if: always(), so they are skipped when a
      # zix suite above failed: fix the engine first, the drivers rerun after.
      - name: postgrez unit tests
        timeout-minutes: 3
        shell: pwsh
        run: zig build postgrez-test-unit --summary all

      - name: rediz unit tests
        timeout-minutes: 3
        shell: pwsh
        run: zig build rediz-test-unit --summary all

      - name: prometheuz unit tests
        timeout-minutes: 3
        shell: pwsh
        run: zig build prometheuz-test-unit --summary all

      # no Linux container support on this runner, so postgrez and rediz
      # test-integration (container lifecycle) are skipped here.
