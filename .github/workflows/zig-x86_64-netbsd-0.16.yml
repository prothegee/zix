name: zig-x86_64-netbsd-0.16

# x86_64-netbsd test leg, pinned to zig 0.16. Runs when a pull request is merged
# (any target branch), or on a manual workflow_dispatch.
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: x86_64-netbsd
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # backstop for the whole leg. GitHub's own default is 6 hours, long enough for a
    # hung test to burn a day of runner minutes before anyone notices. A healthy leg
    # lands well inside this: the slowest measured so far is the openbsd VM at 16
    # minutes, so anything past 30 is a hang, not a slow run.
    timeout-minutes: 40
    steps:
      # tests the ref that triggered the run: the dispatched branch, or the
      # merged pull request result
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v7

      # No GitHub-hosted NetBSD runner exists, so the job boots a real
      # NetBSD VM on top of this ubuntu host and runs the suite inside it.
      # No docker daemon in that VM, so postgrez and rediz test-integration
      # (container lifecycle) are skipped here.
      # A leg that goes silent for many minutes can be a stuck VM rather than
      # a hung test: re-run the job once before diagnosing.
      # The whole leg is one step, so a step-level cap is the only per-leg bound there is.
      # It sits under the job cap on purpose: killing the step still runs Post Checkout, so
      # the log is uploaded. A job-level kill loses the step body entirely.
      - name: Test in NetBSD
        timeout-minutes: 25
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          # nothing built inside the VM is wanted back on the host: this leg only reports pass or
          # fail. Left on, the action rsyncs the whole workspace back, which by then holds a
          # multi-gigabyte .zig-cache, and a copy that size across the VM link is its own failure
          # mode: one FreeBSD run had every suite pass and then reddened on rsync exit 255 at 2.4 GB.
          copyback: false
          prepare: |
            # ftp is the stock NetBSD download tool, the base image has no curl
            ftp -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-netbsd-0.16.0.tar.xz
            # the NetBSD base image ships without /usr/local, create it first
            mkdir -p /usr/local
            tar -C /usr/local -xf /tmp/zig.tar.xz
          run: |
            export PATH="/usr/local/zig-x86_64-netbsd-0.16.0:$PATH"
            cd $GITHUB_WORKSPACE
            zig version

            # The whole leg is one ssh script, so a failed suite must not stop
            # the rest: every suite runs and failures accumulate. The failed:
            # line at the end is the authoritative verdict for this leg.
            failures=""

            timeout 5m zig build unit-test --summary failures --test-timeout 240s || failures="$failures unit-test"
            timeout 5m zig build integration-test --summary failures --test-timeout 240s || failures="$failures integration-test"
            timeout 5m zig build behaviour-test --summary failures --test-timeout 240s || failures="$failures behaviour-test"
            timeout 5m zig build edge-test --summary failures --test-timeout 240s || failures="$failures edge-test"
            timeout 5m zig build jzon-test-all -Ddriver-test-timeout=240s --summary failures || failures="$failures jzon-test-all"
            timeout 5m zig build jzon-examples --summary failures || failures="$failures jzon-examples"

            # Every command below is wrapped: this leg is one step, so without a per-command
            # bound a single stall owns the whole leg until the step cap fires. One run sat 27
            # minutes on rediz-test-edge and reported nothing. timeout exits 124, which the ||
            # records like any other failure, so a stall costs its own command and the rest of
            # the leg still runs. The native legs get the same bounds from their step caps.
            # examples is compile-plus-install only. test-runner-all drives every zix protocol
            # end to end over real sockets inside this VM, so both get 6 minutes where a driver
            # suite gets the 5 the native legs give it.
            timeout 6m zig build examples --summary failures || failures="$failures examples"
            timeout 6m zig build zixer --summary failures || failures="$failures zixer"
            timeout 6m zig build zixer-unit-test --summary failures || failures="$failures zixer-unit-test"
            timeout 6m zig build zixer-examples --summary failures || failures="$failures zixer-examples"
            timeout 10m zig build zixer-test-runner-all --summary failures || failures="$failures zixer-test-runner-all"
            timeout 6m zig build test-runner-all --summary failures || failures="$failures test-runner-all"
            timeout 5m zig build postgrez-test-unit --summary failures || failures="$failures postgrez-test-unit"
            timeout 5m zig build rediz-test-unit --summary failures || failures="$failures rediz-test-unit"
            timeout 5m zig build prometheuz-test-unit --summary failures || failures="$failures prometheuz-test-unit"
            timeout 5m zig build postgrez-test-behaviour --summary failures || failures="$failures postgrez-test-behaviour"
            timeout 5m zig build postgrez-test-edge --summary failures || failures="$failures postgrez-test-edge"
            timeout 5m zig build rediz-test-behaviour --summary failures || failures="$failures rediz-test-behaviour"
            timeout 5m zig build rediz-test-edge --summary failures || failures="$failures rediz-test-edge"
            timeout 5m zig build prometheuz-test-behaviour --summary failures || failures="$failures prometheuz-test-behaviour"
            timeout 5m zig build prometheuz-test-edge --summary failures || failures="$failures prometheuz-test-edge"

            if [ -n "$failures" ]; then
              echo "failed:$failures"
              exit 1
            fi
