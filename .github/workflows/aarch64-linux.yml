name: aarch64-linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: aarch64-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install zig 0.16.0
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz

          echo "$PWD/zig-aarch64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: zig version
        run: zig version

      - name: zix unit, integration, behaviour, edge tests
        run: zig build test-all

      - name: postgrez unit tests
        run: zig build postgrez-test-unit

      - name: rediz unit tests
        run: zig build rediz-test-unit

      - name: prometheuz unit tests
        run: zig build prometheuz-test-unit

      # docker ships preinstalled on this arm64 ubuntu runner, so postgrez and
      # rediz can own their own container lifecycle here. test-runner is out
      # of scope.
      - name: postgrez integration tests
        run: zig build postgrez-test-integration

      - name: rediz integration tests
        run: zig build rediz-test-integration
