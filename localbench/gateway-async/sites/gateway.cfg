# gateway edge: h2 over TLS at the client side, http1 re-originated to the origin
#
# Upstream: localbench/gateway-async/src/main.zig on 127.0.0.1:18960
#
# The edge answers /static itself from public_dir and proxies everything else
# (/baseline2, /json/{count}, /async-db) to the origin. public_prefix bounds
# the file lookup to /static, so a proxied request never pays a file stat and
# an origin 404 stays an origin 404.
#
# The request path is joined onto public_dir as it stands, so /static/app.js is
# the file localbench/data/static/app.js.

engine: http2
ip: ::
port: 8443

tls: true
tls_cert: localbench/certs/server.crt
tls_key: localbench/certs/server.key

upstreams: 127.0.0.1:18960

public_dir: localbench/data
public_prefix: /static
