# zixer daemon config for the localbench gateway-epoll entry
#
# This directory is a zixer root dir: main.cfg here, the edge site under
# sites/. localbench-run.sh and localbench-validate.sh start it from the
# repository root, so every path below is repository-relative.
#
# logs_dir and sites_dir are left out on purpose: they default to <root>/logs
# and <root>/sites. logs/ is not in the repository, the scripts create it.
#
# dispatch is RESERVED in zixer today: it is parsed, range-checked, and printed
# by `zixer status`, and nothing in the serving path reads it. All three
# gateway entries therefore run the SAME edge loops. What actually differs
# across gateway-async, gateway-epoll, and gateway-uring is the BACKEND behind
# this edge (src/main.zig), which really does run that dispatch model.

workers: 0                      # accept loops per tcp site, 0 = all available threads
dispatch: epoll                    # reserved, see above

kernel_backlog: 16 * 1024
max_recv_buf: 16 * 1024

# public_dir cache, shared by every site in this daemon.
# The window is what lets a .br or .gz sibling be negotiated: with it off the
# edge re-opens and re-stats the file on every request and resolves no sibling.
public_dir_cache_ttl_ms: 30 * 1000
public_dir_cache_max_entries: 256
