# zixer daemon config shared by every demo under examples/proxies
#
# This directory is a zixer root dir: main.cfg here, one site file per demo
# under sites/. Run every command from the repository root:
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies status
#
# logs_dir and sites_dir are left out on purpose: they default to <root>/logs
# and <root>/sites, so this root works wherever the repository is checked out.
# logs/ is not in the repository, create it once: mkdir -p examples/proxies/logs
#
# numeric values accept integer math, i.e. 16 * 1024

workers: 0                      # accept loops per tcp site, 0 = all available threads
dispatch: async                 # async | epoll | uring

# per-listener defaults, a site file may override them
kernel_backlog: 1024
max_recv_buf: 8192              # per-connection stream buffer, one leg

# overload valve, counted per site across every worker, 0 = off
# process_limit is what the backend can absorb, not what this box can run
process_limit: 0                # requests running upstream at once
process_queue_len: 0            # requests that may wait for a slot
process_queue_timeout_ms: 6000  # wait before the edge answers 504

# public_dir cache, shared by every site in this daemon, 0 = off
#
# With it off, a static request opens and stats the file every time, and a
# browser sending Accept-Encoding pays that up to three times: once for the
# .br sibling, once for .gz, once for the file itself. With it on, the file
# stays open, its siblings are resolved once, and a repeat request is a table
# lookup.
#
# The window is also the staleness window: a file edited on disk shows up
# within it, with no restart. A site file may set its own, 0 there opts one
# site out. The entry count has no site override, there is one table per
# daemon and this is what sizes it.
public_dir_cache_ttl_ms: 5000     # 0 = every static request re-opens the file
public_dir_cache_max_entries: 256 # files held open, clamped to the fd budget
