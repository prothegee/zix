# http3 edge: zixer terminates QUIC, the upstream leg stays http1
#
# Upstream: examples/proxies/http3.zig on 127.0.0.1:9111 (an http1 server)
#
# Run:
#     ./zig-out/bin/zixer-example-http3-<arch>-<os>-<optimize> &
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies start http3.cfg
#
# Drive (curl must be built with HTTP/3, check `curl --version` for HTTP3):
#     curl -k --http3-only https://localhost:9110/
#     curl -k --http3-only -X POST --data-binary "ping" https://localhost:9110/echo
#
# The certificate below is self-signed for localhost, hence -k. http3 always
# runs over TLS, so this site has no cleartext form. The reply body shows
# `via: 3 zixer`, added by the QUIC edge.

engine: http3
ip: 127.0.0.1
port: 9110

tls: true
tls_cert: examples/certs/ecdsa_p256_cert.pem
tls_key: examples/certs/ecdsa_p256_key.pem

upstreams: 127.0.0.1:9111
