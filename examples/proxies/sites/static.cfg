# static-only site: no upstream at all, zixer answers every request itself
#
# Run:
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start static.cfg
#
# Drive:
#     curl http://127.0.0.1:9114/
#     curl http://127.0.0.1:9114/assets/app.css
#     curl -i http://127.0.0.1:9114/docs/getting-started
#
# `/` maps to index.html, there is no directory listing. The deep link has no
# file behind it and spa_fallback answers it with index.html, which is what a
# client-side routed app needs so a refresh does not 404. Every static reply
# carries `Vary: Accept-Encoding`, and a `.br` or `.gz` sibling next to a file
# would be negotiated against the request Accept-Encoding.
#
# This site serves files and nothing else, so no upstream is needed and none
# is set. That is the point of public_dir: zixer answers from disk itself.

engine: http1
ip: 127.0.0.1
port: 9114

public_dir: examples/proxies/public
spa_fallback: index.html

# This site edits files by hand, so it takes a shorter window than the daemon
# default: a change shows up within a second instead of five. Set 0 to opt out
# entirely and re-open the file on every request. Leave the line out to take
# main.cfg's value.
#
# The window also decides how long a sibling choice stays settled, since the
# .br and .gz probe happens once when the entry is built rather than on every
# request.
public_dir_cache_ttl_ms: 1000
