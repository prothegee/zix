# grpc edge: h2 end to end so trailers survive
#
# Upstream: examples/proxies/grpc.zig on 127.0.0.1:9109
#
# Run:
#     ./zig-out/bin/zixer-example-grpc-<arch>-<os> &
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start grpc.cfg
#
# Drive with grpcurl:
#     grpcurl -proto examples/protobuf/helloworld.proto -plaintext \
#         -d '{"name":"world"}' 127.0.0.1:9108 helloworld.Greeter/SayHello
#     grpcurl -proto examples/protobuf/benchmark.proto -plaintext \
#         -d '{"a":1,"b":2,"count":3}' 127.0.0.1:9108 benchmark.BenchmarkService/StreamSum
#
# A grpc reply carries its status in the trailing header block, which an http1
# hop cannot forward, so this edge relays h2 frames to an h2 upstream and the
# trailers arrive unchanged. A cleartext grpc site requires the h2 connection
# preface, there is no http1 fallback.

engine: grpc
ip: 127.0.0.1
port: 9108

upstreams: 127.0.0.1:9109
