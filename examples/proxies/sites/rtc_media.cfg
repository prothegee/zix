# webrtc media plane: the whole session crosses the per-flow udp forward
#
# Upstream: examples/webrtc/webrtc_datachannel_echo.zig on 127.0.0.1:9083, a
# zix.Webrtc answering peer. It muxes everything on one udp port, which is what
# lets a blind forward sit in front of it at all.
#
# Run:
#     ./zig-out/bin/zix-example-webrtc_datachannel_echo-<arch>-<os> &
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start rtc_media.cfg
#
# Drive with the native dialer, aimed at the edge port:
#     ./zig-out/bin/zix-example-webrtc_native_pair-<arch>-<os> --peer-port 9123
#
# ICE checks, the DTLS handshake, the SCTP association, and the data channel
# message all cross the forward, and the answering peer only ever sees zixer's
# flow socket.
#
# One upstream on purpose: two participants of one call must land on the same
# media instance, and only the signaling plane knows who belongs to which room.
# Round-robin across media instances is the application's routing decision.
#
# In a real deployment the media server must advertise zixer's public address
# as its own ICE candidate, otherwise the candidate it hands out points past
# the gateway.

engine: udp
ip: 127.0.0.1
port: 9123

upstreams: 127.0.0.1:9083
