# mixed site: static files under a prefix, everything else proxied
#
# Upstream: examples/proxies/mixed.zig on 127.0.0.1:9116
#
# Run:
#     ./zig-out/bin/zixer-example-mixed-<arch>-<os> &
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start mixed.cfg
#
# Drive:
#     curl http://127.0.0.1:9115/assets/app.css      # served by zixer
#     curl http://127.0.0.1:9115/                    # served by the upstream
#     curl http://127.0.0.1:9115/api/health          # served by the upstream
#
# public_prefix bounds the file lookup to /assets, so a proxied request never
# pays a file stat, and a backend 404 stays a backend 404. The request path is
# joined onto public_dir as it stands, so /assets/app.css is the file
# examples/proxies/public/assets/app.css.

engine: http1
ip: 127.0.0.1
port: 9115

upstreams: 127.0.0.1:9116

public_dir: examples/proxies/public
public_prefix: /assets
