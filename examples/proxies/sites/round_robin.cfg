# round robin: two upstream instances, bounded retry when one dies
#
# Upstreams: two copies of examples/proxies/round_robin.zig, on 9118 and 9119
#
# Run:
#     ./zig-out/bin/zixer-example-round_robin-<arch>-<os>-<optimize> --port 9118 &
#     ./zig-out/bin/zixer-example-round_robin-<arch>-<os>-<optimize> --port 9119 &
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies start round_robin.cfg
#
# Drive:
#     curl http://127.0.0.1:9117/ http://127.0.0.1:9117/ http://127.0.0.1:9117/
#
# Each reply names the instance that answered, so the rotation is visible. Kill
# one instance and keep going: the failed connect marks that upstream down and
# the retry lands on the survivor, so requests keep being answered. A downed
# upstream sits out a cooldown and is re-admitted on a later pick.

engine: http1
ip: 127.0.0.1
port: 9117

upstreams: 127.0.0.1:9118, 127.0.0.1:9119
