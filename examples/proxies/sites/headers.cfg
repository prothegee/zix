# headers site: the headers this site adds on each leg, written as two blocks
#
# Upstream: examples/proxies/headers.zig on 127.0.0.1:9129
#
# Run:
#     ./zig-out/bin/zixer-example-headers-<arch>-<os>-<optimize> &
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies start headers.cfg
#
# Drive:
#     curl -D - http://127.0.0.1:9128/
#     curl -D - http://127.0.0.1:9129/      # the backend on its own, to compare
#
# The response head carries the three [response_headers] lines. The reply body
# is the backend reporting what reached it, which is where the
# [request_headers] lines show up with their tokens filled in.
#
# X-Frame-Options is in both places on purpose: the backend answers SAMEORIGIN
# and this site sets DENY, and the client sees one line, DENY. A configured
# name replaces the relayed copy rather than joining it, because rfc 9110 5.2
# would otherwise comma-join the two into SAMEORIGIN, DENY.
#
# A section runs to the end of the file, so every flat key comes first.

engine: http1
ip: 127.0.0.1
port: 9128

upstreams: 127.0.0.1:9129

[response_headers]
x-frame-options: DENY
x-content-type-options: nosniff
x-served-over: $scheme

[request_headers]
x-real-ip: $client_ip
x-forwarded-proto: $scheme
x-forwarded-host: $host
x-edge-tenant: proxies-demo
