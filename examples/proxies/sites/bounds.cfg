# bounds site: what the edge is allowed to spend on one client and one backend
#
# Upstream: examples/proxies/bounds.zig on 127.0.0.1:9125
#
# Run:
#     ./zig-out/bin/zixer-example-bounds-<arch>-<os>-<optimize> &
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies start bounds.cfg
#
# Drive:
#     curl http://127.0.0.1:9124/
#     printf 'GET / HTTP/1.1\r\nHost: 127.0.0.1:9124\r\n' | nc 127.0.0.1 9124
#     for i in 1 2 3 4; do (sleep 30 | nc 127.0.0.1 9124 &) ; done
#     curl -v http://127.0.0.1:9124/
#
# The second command sends part of a request head and never finishes it: two
# seconds later the edge takes the connection away and answers 408. The last
# two hold four connections open and then ask for a fifth, which is one past
# client_conn_limit and is refused with 503 before it sends a byte.
#
# client_timeout_ms covers one whole exchange, the head read included, and is
# re-armed for the next request on a keep-alive connection. The two upstream
# keys bound the other leg: a connect that goes unanswered costs two seconds
# instead of whatever the operating system decides, and an unused backend
# connection is kept ten seconds for the next request.

engine: http1
ip: 127.0.0.1
port: 9124

upstreams: 127.0.0.1:9125

client_timeout_ms: 2 * 1000
client_conn_limit: 4

upstream_connect_timeout_ms: 2 * 1000
upstream_idle_ttl_ms: 10 * 1000
