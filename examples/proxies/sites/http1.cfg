# http1 proxy: plain request proxy with keep-alive reuse
#
# Upstream: examples/proxies/http1.zig on 127.0.0.1:9101
#
# Run:
#     ./zig-out/bin/zixer-example-http1-<arch>-<os>-<optimize> &
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies start http1.cfg
#
# Drive:
#     curl -v http://127.0.0.1:9100/
#     curl -X POST --data-binary "ping" http://127.0.0.1:9100/echo
#
# The reply body shows the Via and Forwarded lines zixer added on the upstream
# leg, and the response head carries its own `Via: 1.1 zixer`. Both legs are
# keep-alive: a second request on the same client connection is served over the
# same pooled upstream connection.

engine: http1
ip: 127.0.0.1
port: 9100

upstreams: 127.0.0.1:9101
