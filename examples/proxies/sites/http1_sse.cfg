# http1 sse proxy: streamed response passthrough, no idle timeout
#
# Upstream: examples/proxies/http1_sse.zig on 127.0.0.1:9103
#
# Run:
#     ./zig-out/bin/zixer-example-http1_sse-<arch>-<os> &
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start http1_sse.cfg
#
# Drive:
#     curl -N http://127.0.0.1:9102/events
#
# Each event reaches the client as the upstream sends it, 400 ms apart. A
# buffered relay would hold them until the stream closed, so the gap between
# printed lines is the proof.

engine: http1
ip: 127.0.0.1
port: 9102

upstreams: 127.0.0.1:9103
