# webrtc signaling plane: wss at the edge, cleartext websocket to the upstream
#
# Upstream: examples/proxies/http1_ws.zig on 127.0.0.1:9105, the same
# websocket server the http1_ws demo uses. Signaling is an ordinary websocket
# site, nothing about it is webrtc-specific.
#
# Run:
#     ./zig-out/bin/zixer-example-http1_ws-<arch>-<os> &
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start rtc_signal.cfg
#
# Drive:
#     websocat --insecure wss://localhost:9122/ws
#
# The media plane is the sibling site rtc_media.cfg. Which participants share a
# room is decided here, in the application behind this site, never by zixer.

engine: http1
ip: 127.0.0.1
port: 9122

tls: true
tls_cert: examples/certs/ecdsa_p256_cert.pem
tls_key: examples/certs/ecdsa_p256_key.pem

upstreams: 127.0.0.1:9105
