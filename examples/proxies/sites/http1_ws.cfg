# http1 websocket proxy: upgrade tunnel, upstream pick pinned at upgrade
#
# Upstream: examples/proxies/http1_ws.zig on 127.0.0.1:9105
#
# Run:
#     ./zig-out/bin/zixer-example-http1_ws-<arch>-<os> &
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start http1_ws.cfg
#
# Drive (either tool):
#     websocat ws://127.0.0.1:9104/ws
#     wscat -c ws://127.0.0.1:9104/ws
#
# Type a line and the upstream echoes it back. zixer relays the rfc 6455
# handshake, then the connection is a raw two-way tunnel to the upstream that
# answered the upgrade, and that upstream stays pinned for the tunnel life.

engine: http1
ip: 127.0.0.1
port: 9104

upstreams: 127.0.0.1:9105
