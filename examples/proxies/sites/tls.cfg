# tls terminate: https at the client edge, cleartext http1 to the upstream
#
# Upstream: examples/proxies/tls.zig on 127.0.0.1:9121 (a cleartext server)
#
# Run:
#     ./zig-out/bin/zixer-example-tls-<arch>-<os>-<optimize> &
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies start tls.cfg
#
# Drive:
#     curl -k https://localhost:9120/
#     curl -k --http1.1 -v https://localhost:9120/ 2>&1 | rg "ALPN|TLSv1"
#
# The certificate below is self-signed for localhost, hence -k. The backend
# never sees TLS: it is an ordinary cleartext http1 server that gained https
# without a line of its own code changing. A request whose Host does not match
# a name in the certificate is answered 421 by the edge.
#
# Renewal: point tls_cert and tls_key at the certbot live paths and hook the
# reload to a restart of this site, i.e.
#     certbot renew --deploy-hook "zixer restart tls.cfg"

engine: http1
ip: 127.0.0.1
port: 9120

tls: true
tls_cert: examples/certs/ecdsa_p256_cert.pem
tls_key: examples/certs/ecdsa_p256_key.pem

upstreams: 127.0.0.1:9121
