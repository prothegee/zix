# udp forward: one client flow sticks to one upstream, blind bytes both ways
#
# Upstream: examples/proxies/udp.zig on 127.0.0.1:9113
#
# Run:
#     ./zig-out/bin/zixer-example-udp-<arch>-<os> &
#     ./zig-out/bin/zixer-<arch>-<os> --dir examples/proxies start udp.cfg
#
# Drive with the udp client example, aimed at the edge port:
#     ./zig-out/bin/zix-example-udp_client-<arch>-<os> --server-port 9112
#
# zixer forwards each client flow through its own socket, so the upstream sees
# one distinct peer per client, which is what ICE and DTLS state needs. There
# is no connect step in udp and so no failure signal: every upstream always
# counts as ready and the pick sticks for the flow life.

engine: udp
ip: 127.0.0.1
port: 9112

upstreams: 127.0.0.1:9113
