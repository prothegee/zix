# http2 edge: h2 on the client side, http1 re-originated to the upstream
#
# Upstream: examples/proxies/http2.zig on 127.0.0.1:9107 (an http1 server)
#
# Run:
#     ./zig-out/bin/zixer-example-http2-<arch>-<os>-<optimize> &
#     ./zig-out/bin/zixer-<arch>-<os>-<optimize> --dir examples/proxies start http2.cfg
#
# Drive:
#     curl --http2-prior-knowledge http://127.0.0.1:9106/
#     curl --http2-prior-knowledge -X POST --data-binary "ping" http://127.0.0.1:9106/echo
#     curl --http1.1 http://127.0.0.1:9106/
#
# A cleartext http2 site sniffs the connection preface, so the same port also
# serves plain http1 clients: the third command above is answered over http1 by
# the same site. curl reports HTTP/2 on the client side while the report body
# shows an ordinary http1 request head, which is the whole point of this demo.

engine: http2
ip: 127.0.0.1
port: 9106

upstreams: 127.0.0.1:9107
